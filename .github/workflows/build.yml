name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orca-integration/package-lock.json
      - run: npm ci --prefix orca-integration
      - run: npm test --prefix orca-integration
      - run: g++ -std=c++17 -O2 -DNDEBUG tests/frame_test.cpp -o /tmp/quotamon-frame-test
      - run: /tmp/quotamon-frame-test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python tools/bootstrap_dependencies.py
      - run: python -m pip install Pillow==12.3.0
      - run: tools\build_native.cmd
        shell: cmd
      - run: build\native\quotamon_protocol_test.exe
      - run: python tools/verify_native_visuals.py
      - run: dotnet publish orca-integration/windows/Quotamon.Ble.csproj -c Release -o dist/orca-resource
      - run: dist\orca-resource\Quotamon.Ble.exe --probe
      - uses: actions/upload-artifact@v4
        with:
          name: native-lvgl-preview
          path: visuals/native/*.png
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/bootstrap_dependencies.py
      - run: python -m pip install platformio==6.1.18 intelhex==2.3.0
      - run: python -m platformio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: lcd7-firmware-build-not-hardware-tested
          path: |
            firmware/.pio/build/waveshare-lcd7/firmware.bin
            firmware/.pio/build/waveshare-lcd7/bootloader.bin
            firmware/.pio/build/waveshare-lcd7/partitions.bin
            firmware/.pio/build/waveshare-lcd7/firmware.elf
