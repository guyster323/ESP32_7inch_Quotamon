<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotamon · 모션 데모</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:#080e18;color:#eef7fb}
    *{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:auto;padding:28px 20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    h1{font-size:24px;margin:0 0 8px;letter-spacing:-.7px}p{font-size:14px;line-height:1.7;color:#91a6b8;margin:0}
    video{display:block;width:100%;height:auto;border:1px solid #2b404b;border-radius:16px;background:#080e18}
    .actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:18px 0}
    button,a{font:inherit;font-size:14px;border:1px solid #31544b;background:#142b25;color:#a8e9d1;padding:10px 15px;border-radius:8px;text-decoration:none;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid #70e4bf;outline-offset:3px}
    #status{color:#70e4bf;font-size:13px;white-space:nowrap}.note{font-size:12px}
    @media(max-width:600px){main{padding:20px 12px}header{display:block}#status{display:block;margin-top:12px}h1{font-size:21px}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Quotamon · 모션 데모</h1>
      <p>전체 화면 → 터치 상세 → 리셋 일정 → 최근 갱신 시각</p>
    </div>
    <span id="status" role="status" aria-live="polite">영상 준비 중</span>
  </header>
  <video id="demo" controls autoplay muted loop playsinline preload="auto" poster="quotamon-display.png" aria-label="Quotamon 5카드 화면의 14초 모션 데모">
    <source src="quotamon-demo.mp4" type="video/mp4">
    <img src="quotamon-demo.gif" alt="Quotamon 모션 GIF">
  </video>
  <div class="actions">
    <button id="restart" type="button">처음부터 재생</button>
    <a href="quotamon-demo.mp4">MP4 영상 열기</a>
    <a href="quotamon-demo.gif">GIF 원본</a>
    <a href="quotamon-display.png">정지 화면</a>
  </div>
  <p class="note">보드와 같은 LVGL 코드로 만든 화면입니다. 수치는 공개용 예시이며 기기 프레임·강조·전환은 소개용 그래픽입니다.</p>
</main>
<script>
  const video=document.getElementById('demo');
  const status=document.getElementById('status');
  video.muted=true;
  video.addEventListener('playing',()=>status.textContent='재생 중 · 자동 반복');
  video.addEventListener('pause',()=>status.textContent='일시정지');
  video.addEventListener('error',()=>status.textContent='GIF 원본 또는 MP4 영상 열기를 선택해 주세요.');
  document.getElementById('restart').addEventListener('click',()=>{
    video.currentTime=0;
    video.play().catch(()=>status.textContent='영상의 재생 버튼을 눌러 주세요.');
  });
  video.play().catch(()=>status.textContent='영상의 재생 버튼을 눌러 주세요.');
</script>
</body>
</html>
